title: Detect PowerShell Randomized Character Case Obfuscation
id: e7f6a5b4-3210-9abc-def0-123456789abc
status: test
description: Detects PowerShell scripts containing words with frequent uppercase and lowercase character transitions, which may indicate randomized character case obfuscation.
author: Pham Tien Phat
date: 2026-08-01
logsource:
    product: windows
    category: ps_script
    definition: PowerShell Script Block Logging must be enabled (Event ID 4104)
detection:
    selection_randomized_case:
        ScriptBlockText|re: '(?:[a-z][A-Z]|[A-Z][a-z]){3,}'
    condition: selection_randomized_case
falsepositives:
    - Scripts containing intentionally mixed-case identifiers
    - Automatically generated PowerShell scripts
    - Legitimate strings using mixed capitalization
level: low
tags:
    - attack.defense-evasion
    - attack.t1027
    - attack.t1059.001
